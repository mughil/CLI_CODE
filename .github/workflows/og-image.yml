name: Generate og image
on:
  push:
    branches: [feat/static-landing-rows]
    paths: [.github/workflows/og-image.yml]
permissions:
  contents: write
jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pillow --quiet
      - name: Generate assets/og.png
        run: |
          echo "" | base64 -d > /tmp/gen_og.py
          python3 /tmp/gen_og.py
      - name: Commit og.png
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og.png
          git commit -m "Update og.png wording to command examples"
          git push origin HEAD:feat/static-landing-rows
