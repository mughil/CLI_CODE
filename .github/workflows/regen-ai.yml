name: Regenerate AI entry data + build outputs
on:
  push:
    branches: [fix/ai-entry-accuracy]
    paths: [.github/workflows/regen-ai.yml]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/tmp-ai-edits.mjs
      - run: npm run build
      - name: Commit corrected data + regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Correct AI-category entries and regenerate build outputs"
          git push origin HEAD:fix/ai-entry-accuracy
