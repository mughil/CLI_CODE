name: Regenerate build outputs
on:
  push:
    branches: [chore/regenerate-build-outputs]
    paths: [.github/workflows/regen.yml]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Regenerate committed build outputs (npm run build)"
          git push origin HEAD:chore/regenerate-build-outputs
