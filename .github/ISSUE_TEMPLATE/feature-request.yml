name: Feature request
description: Suggest an improvement to the site or tooling.
title: "Feature: <short title>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's hard or missing today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Fits the project constraints
      options:
        - label: Works client-side with no backend
        - label: Keeps the shipped site dependency-free
        - label: Doesn't require fabricating tool data
