<main id="main" class="wrap" style="padding-top:30px;padding-bottom:64px;max-width:820px">
  <h1 class="sec-title">Find my <span class="g">CLI</span></h1>
  <p class="sec-sub">Describe the task. Recommendations are scored deterministically against each tool's tags, categories and use cases — and every result shows why it matched.</p>

  <form id="find-form" style="margin-top:22px">
    <label for="goal" class="sr-only">Describe what you want to do</label>
    <textarea id="goal" rows="3" placeholder="e.g. inspect and mock HTTP APIs from the terminal" style="width:100%"></textarea>
    <div class="find-actions">
      <button type="submit" class="btn btn-accent">Find tools</button>
      <div class="examples">
        <button type="button" class="chip" data-example="inspect and mock HTTP APIs from the terminal">mock HTTP APIs</button>
        <button type="button" class="chip" data-example="run a local LLM and store embeddings for RAG">local LLM + RAG</button>
        <button type="button" class="chip" data-example="edit video and burn in subtitles">edit video + subtitles</button>
        <button type="button" class="chip" data-example="take linked markdown notes in a local knowledge base">markdown notes</button>
        <button type="button" class="chip" data-example="automate a workflow connecting several APIs">automate a workflow</button>
      </div>
    </div>
  </form>

  <div id="find-results" style="margin-top:26px" aria-live="polite"></div>
</main>

<footer class="site-foot">
  <div class="wrap"><span>CLI_CODE — open CLI directory.</span><span>Apache-2.0</span></div>
